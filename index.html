<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:       #EDF3FA;
  --surf:     #FFFFFF;
  --card:     #FFFFFF;
  --border:   #DDEAF5;
  --border-s: #EBF3FB;
  --shadow:   0 1px 3px rgba(11,32,58,.06), 0 6px 18px rgba(11,32,58,.05);
  --shadow-s: 0 1px 2px rgba(11,32,58,.05);

  --acc:      #0898AA;
  --acc-dim:  rgba(8,152,170,.09);
  --acc-glow: rgba(8,152,170,.22);

  --purple:   #7B5CFA;
  --pur-dim:  rgba(123,92,250,.09);
  --rose:     #F43F5E;
  --ros-dim:  rgba(244,63,94,.09);
  --ok:       #16A34A;
  --ok-dim:   rgba(22,163,74,.09);
  --warn:     #D97706;
  --warn-dim: rgba(217,119,6,.1);

  --t1:  #0F2030;
  --t2:  #3F5E76;
  --t3:  #8AAFC8;
  --t4:  #B8D0E4;

  --sw:  220px;
  --th:  56px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0B1925; --surf:#122034; --card:#192C41;
    --border:#1F3A55; --border-s:#182E45;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --shadow-s:0 1px 2px rgba(0,0,0,.2);
    --t1:#D8EAF8; --t2:#7A9BB8; --t3:#3D617E; --t4:#1F3A55;
  }
}
:root[data-theme="dark"] {
  --bg:#0B1925; --surf:#122034; --card:#192C41;
  --border:#1F3A55; --border-s:#182E45;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --shadow-s:0 1px 2px rgba(0,0,0,.2);
  --t1:#D8EAF8; --t2:#7A9BB8; --t3:#3D617E; --t4:#1F3A55;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);display:flex}

/* ─── SIDEBAR ──────────────────────────────────────────── */
.sidebar{
  width:var(--sw);flex-shrink:0;
  background:var(--surf);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-brand{
  padding:18px 16px 16px;border-bottom:1px solid var(--border-s);
  display:flex;align-items:center;gap:10px;
}
.sb-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#0775A0,#0DC5D4);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:900;letter-spacing:-1px;
  font-family:'DM Mono',monospace;flex-shrink:0;
}
.sb-appname{font-size:15px;font-weight:800;letter-spacing:-.4px;color:var(--acc);}
.sb-tagline{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.9px;margin-top:1px;}

.sb-sec{padding:14px 12px 4px;}
.sb-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;padding:0 4px;margin-bottom:5px;}

.cl-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:9px;
  background:var(--acc-dim);border:1px solid rgba(8,152,170,.15);
}
.cl-ava{
  width:30px;height:30px;border-radius:8px;background:#007A8A;
  font-size:10px;font-weight:800;color:#fff;letter-spacing:-.3px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cl-name{font-size:12px;font-weight:700;color:var(--acc);}
.cl-sector{font-size:10px;color:var(--t3);margin-top:1px;}
.cl-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;flex-shrink:0;margin-left:auto;box-shadow:0 0 0 2px rgba(34,197,94,.2);}

.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:9px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--t2);transition:all .15s;
  margin-bottom:2px;
}
.nav-item:hover{background:var(--border-s);color:var(--t1);}
.nav-item.active{background:var(--acc-dim);color:var(--acc);font-weight:700;}
.nav-ico{width:18px;text-align:center;font-size:14px;}
.nav-badge{
  margin-left:auto;font-size:9px;font-weight:700;
  background:var(--warn);color:#fff;padding:2px 6px;border-radius:20px;
}

.sb-bottom{
  margin-top:auto;padding:14px;border-top:1px solid var(--border-s);
}
.sb-upd{font-size:10px;color:var(--t3);line-height:1.6;margin-bottom:10px;}
.sb-upd strong{color:var(--t2);}
.theme-row{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px;border:1px solid var(--border);}
.tbtn{flex:1;padding:5px;border-radius:6px;font-size:10px;font-weight:600;text-align:center;cursor:pointer;color:var(--t3);transition:all .15s;}
.tbtn.active{background:var(--surf);color:var(--acc);box-shadow:var(--shadow-s);}

/* ─── MAIN ──────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.topbar{
  height:var(--th);flex-shrink:0;
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;gap:12px;
}
.tb-name{font-size:15px;font-weight:800;letter-spacing:-.3px;flex:1;}
.live-badge{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;color:#16A34A;
  background:rgba(22,163,74,.1);padding:4px 10px;border-radius:20px;
}
.pulse-dot{
  width:7px;height:7px;border-radius:50%;background:#22C55E;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.tb-period{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;}
.ico-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--surf);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;color:var(--t2);transition:all .15s;flex-shrink:0;
}
.ico-btn:hover{background:var(--acc-dim);color:var(--acc);border-color:var(--acc);}
.ico-btn.spin{animation:rotate .5s linear}
@keyframes rotate{to{transform:rotate(360deg)}}
.share-btn{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;
  font-size:11px;font-weight:700;background:var(--acc);color:#fff;
  cursor:pointer;transition:opacity .15s;flex-shrink:0;
}
.share-btn:hover{opacity:.88;}

/* Tab nav */
.tab-nav{
  display:flex;padding:0 24px;
  background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;
}
.tab{
  padding:11px 14px;font-size:12px;font-weight:600;color:var(--t3);
  cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;
}
.tab:hover{color:var(--t2);}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);}
.tab-pill{display:inline-block;margin-left:5px;background:var(--warn);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;vertical-align:middle;}

/* ─── CONTENT ──────────────────────────────────────────── */
.content{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px;}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Month filter */
.month-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--surf);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;
  box-shadow:var(--shadow-s);
}
.mf-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;}
.mf-chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;}
.mf-chips::-webkit-scrollbar{display:none}
.mf-chip{
  padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:all .15s;
  color:var(--t2);background:var(--bg);border:1px solid var(--border);
  flex-shrink:0;
}
.mf-chip:hover{border-color:var(--acc);color:var(--acc);}
.mf-chip.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.plat-toggle{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;flex-shrink:0;}
.plat-btn{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--t3);transition:all .15s;white-space:nowrap;}
.plat-btn:hover{color:var(--t2);}
.plat-btn.active{background:var(--surf);color:var(--acc);box-shadow:var(--shadow-s);}
.api-notice{font-size:10px;color:var(--t3);padding:6px 14px;background:var(--bg);border:1px solid var(--border-s);border-radius:8px;text-align:center;}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi{
  background:var(--surf);border-radius:12px;padding:18px 18px 14px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.kpi-stripe{
  position:absolute;top:0;left:0;width:4px;height:100%;border-radius:12px 0 0 12px;
}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.kpi-val{
  font-size:26px;font-weight:800;font-family:'DM Mono',monospace;
  letter-spacing:-1px;line-height:1;margin-bottom:9px;font-variant-numeric:tabular-nums;
  transition:all .3s;
}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;}
.chip.up{background:rgba(22,163,74,.1);color:#16A34A;}
.chip.neu{background:var(--acc-dim);color:var(--acc);}
.chip.live{background:rgba(34,197,94,.12);color:#16A34A;}
.kpi-spark{position:absolute;bottom:0;right:0;opacity:.18;}

/* Loading shimmer */
@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:.7}}
.skel{background:var(--border);border-radius:5px;animation:shimmer 1.4s infinite;}

/* Live indicator on KPI */
.live-dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#22C55E;margin-right:4px;
  animation:blink 2s ease-in-out infinite;
}

/* 2-col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.card{
  background:var(--surf);border:1px solid var(--border);
  border-radius:12px;padding:20px;box-shadow:var(--shadow);
}
.card-ttl{
  font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:16px;display:flex;align-items:center;gap:7px;
}

/* Platform bars */
.plt{margin-bottom:15px;}
.plt:last-child{margin-bottom:0;}
.plt-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.plt-name{font-size:12px;font-weight:600;color:var(--t1);}
.plt-val{font-size:13px;font-weight:700;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;}
.plt-sub{font-size:10px;color:var(--t3);margin-top:3px;}
.track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--border-s);}
.bar{height:100%;border-radius:3px;}
.bar.t{background:linear-gradient(90deg,#0775A0,#0DC5D4);}
.bar.o{background:linear-gradient(90deg,#B45309,#F59E0B);}
.bar.g{background:linear-gradient(90deg,#15803D,#22C55E);}

/* Growth grid */
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.g-item{background:var(--bg);border:1px solid var(--border-s);border-radius:9px;padding:11px 13px;}
.g-lbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.g-val{font-size:18px;font-weight:800;font-family:'DM Mono',monospace;letter-spacing:-.4px;line-height:1;}
.g-base{font-size:10px;color:var(--t3);margin-top:3px;}

.strip{
  margin-top:13px;padding:9px 14px;border-radius:8px;
  font-size:11px;font-weight:600;text-align:center;
}
.strip.teal{background:var(--acc-dim);color:var(--acc);border:1px solid rgba(8,152,170,.18);}
.strip.ok{background:var(--ok-dim);color:var(--ok);border:1px solid rgba(22,163,74,.18);}

/* Posts */
.post{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-s);}
.post:last-child{border-bottom:none;}
.post-rank{
  width:24px;height:24px;border-radius:6px;
  font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--bg);color:var(--t3);
}
.post-rank.g{background:rgba(217,119,6,.12);color:var(--warn);}
.post-info{flex:1;min-width:0;}
.post-ttl{font-size:11px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post-type{font-size:10px;color:var(--t3);margin-top:2px;}
.post-stat{text-align:right;flex-shrink:0;}
.post-views{font-size:12px;font-weight:800;font-family:'DM Mono',monospace;color:var(--t1);font-variant-numeric:tabular-nums;}
.post-int{font-size:10px;color:var(--t3);}

/* Donut */
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px;margin:4px 0 16px;}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2);margin-bottom:7px;}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* Insight */
.insight{
  background:linear-gradient(135deg,var(--acc) 0%,#0DC5D4 100%);
  border-radius:12px;padding:22px 26px;text-align:center;
  box-shadow:0 4px 20px rgba(8,152,170,.25);
}
.insight-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.7);margin-bottom:8px;}
.insight-body{font-size:13px;color:rgba(255,255,255,.9);line-height:1.75;max-width:600px;margin:0 auto;}
.insight-body strong{color:#fff;}

/* Month empty state */
.month-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:60px;text-align:center;
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);min-height:240px;
}
.me-icon{font-size:32px;opacity:.35;}
.me-ttl{font-size:14px;font-weight:600;color:var(--t2);}
.me-sub{font-size:12px;color:var(--t3);line-height:1.65;max-width:260px;}

/* Coming soon */
.cs{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:60px;text-align:center;
}
.cs-ico{font-size:34px;opacity:.3;}
.cs-ttl{font-size:14px;font-weight:600;color:var(--t2);}
.cs-sub{font-size:12px;color:var(--t3);line-height:1.65;max-width:260px;}

/* Live banner */
.live-banner{
  display:flex;align-items:center;gap:8px;
  background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.2);
  border-radius:8px;padding:8px 14px;font-size:11px;color:var(--ok);font-weight:600;
}

/* Toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--t1);color:var(--surf);
  font-size:12px;font-weight:600;padding:10px 18px;border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  pointer-events:none;z-index:999;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>

// ── UTILS ─────────────────────────────────────────────
function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString('es-CO');
}

function timeAgo(date) {
  if (!date) return 'Cargando...';
  const mins = Math.round((Date.now() - new Date(date))/60000);
  if (mins < 1) return 'Ahora mismo';
  if (mins < 60) return `Hace ${mins} min`;
  const hrs = Math.floor(mins/60);
  return `Hace ${hrs}h`;
}

// ── SPARKLINES ────────────────────────────────────────
function sparkline(pts, color='#0DC5D4') {
  const w=68,h=30,mn=Math.min(...pts),mx=Math.max(...pts),rng=mx-mn||1;
  const path = pts.map((v,i)=>{
    const x=(i/(pts.length-1))*w;
    const y=h-((v-mn)/rng)*(h-3)-1;
    return(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return `<svg class="kpi-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function updateSidebar() {
  const el = document.getElementById('sb-upd');
  if (el && LIVE) el.innerHTML = `Actualizado:<br><strong>${timeAgo(LIVE.updated)}</strong> · Instagram API`;
}

// ── LOAD & AUTO-REFRESH ───────────────────────────────
async function loadData() {
  try {
    await fetchLiveData();
    updateSidebar();
    render();
    // Actualizar "hace X min" cada minuto
    setInterval(updateSidebar, 60000);
    // Re-fetch cada 10 minutos
    refreshTimer = setInterval(async () => {
      await fetchLiveData();
      updateSidebar();
      if (currentTab === 'redes') render();
    }, 600000);
  } catch(e) {
    console.error('Error cargando datos live:', e);
    document.getElementById('sb-upd').innerHTML = 'Datos históricos<br><strong>Ene–Sep 2026</strong>';
    document.getElementById('tb-period').textContent = 'Ene 1 – Sep 7, 2026';
    render();
  }
}

// ── NAV ───────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab, .nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab));
  render();
}
document.querySelector('.tab-nav').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (t) setTab(t.dataset.tab);
});
document.querySelector('.sb-sec:nth-child(3)').addEventListener('click', e => {
  const t = e.target.closest('.nav-item'); if (t) setTab(t.dataset.tab);
});

// ── THEME ─────────────────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btn-light').classList.toggle('active', t === 'light');
  document.getElementById('btn-dark').classList.toggle('active', t === 'dark');
}
document.documentElement.setAttribute('data-theme', 'light');

// ── ACTIONS ───────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2300);
}

async function handleRefresh() {
  const b = document.getElementById('refresh-btn');
  b.classList.add('spin');
  try {
    await fetchLiveData();
    updateSidebar();
    render();
    showToast('✓ Datos actualizados desde Instagram');
  } catch(e) {
    showToast('⚠️ Error al actualizar');
  }
  setTimeout(() => b.classList.remove('spin'), 500);
}

function handleShare() {
  try { navigator.clipboard.writeText(location.href); showToast('🔗 Enlace copiado'); }
  catch { showToast('🔗 Enlace listo para compartir'); }
}

// ── INIT ──────────────────────────────────────────────
render(); // render estático inmediato
loadData(); // luego reemplaza con datos live
</script>
