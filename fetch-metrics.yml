name: Fetch Instagram Metrics

on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:        # también se puede correr manualmente desde GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch metrics from Meta API
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: node scripts/fetch-metrics.js

      - name: Commit metrics.json
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse@noreply.github.com"
          git add metrics.json
          git diff --cached --quiet || git commit -m "update metrics $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
